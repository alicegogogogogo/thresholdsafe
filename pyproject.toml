[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thresholdsafe"
version = "0.1.0"
description = "Threshold secret sharing custody with two-person approval and rotation"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
